name: Build

# Every push to main builds the app on a GitHub Mac, runs the core tests, and publishes the
# installer as the "Latest build" release (Releases page → Vivid Playback x.y.z.dmg).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test the timecode core
        run: swift test

      - name: Version
        # Each build gets its own number: 0.2.<build number>.
        run: |
          echo "VERSION=0.2.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "SUBJECT=$(git log -1 --format=%s)" >> "$GITHUB_ENV"

      - name: Build the installer
        run: ./scripts/make-dmg.sh

      - name: Check the app
        run: |
          APP="build/Vivid Playback.app"
          lipo -info "$APP/Contents/MacOS/Vivid Playback"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          codesign --verify --deep --verbose=2 "$APP"
          ls "$APP/Contents/Resources/Fonts" "$APP/Contents/Resources/Images" "$APP/Contents/Resources/AppIcon.icns"

      - name: Launch it on each screen and take screenshots
        run: |
          mkdir -p build/screens
          BIN="build/Vivid Playback.app/Contents/MacOS/Vivid Playback"
          for screen in first-run library timeline clock connections consoles albums; do
            if [ "$screen" = "first-run" ]; then "$BIN" > "build/screens/$screen.log" 2>&1 &
            else "$BIN" --demo "$screen" > "build/screens/$screen.log" 2>&1 & fi
            PID=$!
            sleep 14
            screencapture -x "build/screens/$screen.png" || true
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "The app quit on the $screen screen:"; cat "build/screens/$screen.log"; exit 1
            fi
            kill "$PID"; sleep 2
          done
          echo "The app stayed up on every screen."

      - name: Keep the screenshots on the ci-screens branch
        run: |
          cp -R build/screens "$RUNNER_TEMP/screens"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-screens
          git rm -rfq .
          cp "$RUNNER_TEMP"/screens/*.png .
          git add *.png
          git commit -qm "Screens for ${GITHUB_SHA::7}"
          git push -qf origin ci-screens

      - uses: actions/upload-artifact@v4
        with:
          name: Vivid-Playback
          path: build/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Screens
          path: build/screens

      - name: Publish this version as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The old single "latest" release is replaced by one release per version.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION" build/*.dmg \
            --title "Vivid Playback $VERSION" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "$SUBJECT

          Download the .dmg, open it and drag Vivid Playback to Applications. Choose Replace if it asks: your shows are kept (they live in Documents › Vivid Playback). The first time, macOS may block it: open System Settings › Privacy & Security and click Open Anyway."
